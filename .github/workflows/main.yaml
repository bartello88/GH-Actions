name: Python package
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
          - name: Get the code
            uses: actions/checkout@v4
          - name: Install depedencies
            id: test_output
            uses: ./.github/actions/install-depedencies
            with:
                package_name: pytest
                # app_name: abc
          - name: Run the code
            id: test_app
            run: |
              echo "Test"
              echo "$GITHUB_REF"
              echo "Commit ${{ github.sha }}"
              echo ${{ github.repository}}
              echo ${{ github.ref }}
              echo "Test"
              echo "test=Testing" >> $GITHUB_OUTPUT
              python app.py
          - name: Output vaule
            run: |
              echo "${{ steps.test_output.outputs.test_value1 }}"
              echo "${{ steps.test_output.outputs.test_value2 }}"
    checks:
        name: Checking
        uses: ./.github/workflows/checks.yaml
        with:
            input_name: Bartek
